# CloudNativePG operator chart 0.29.1 (operator 1.30.1).
# The chart version is pinned in scripts/bootstrap.sh.
replicaCount: 1
config:
  clusterWide: true
monitoring:
  podMonitorEnabled: false
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
webhook:
  livenessProbe:
    initialDelaySeconds: 3
  readinessProbe:
    initialDelaySeconds: 3
